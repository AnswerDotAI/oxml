[build-system]
requires = ["maturin>=1.9.2,<2.0"]
build-backend = "maturin"

[project]
name = "oxml"
dynamic = ["version"]
description = "Office Open XML client"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["fastcore>=2.2.26"]
readme = "README.md"
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = ["fastws-cli>=0.0.20", "fastship>=0.0.11", "maturin>=1.0,<2.0", "pytest"]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/oxml"
Repository = "https://github.com/AnswerDotAI/oxml"
Issues = "https://github.com/AnswerDotAI/oxml/issues"

[tool.maturin]
python-source = "python"
module-name = "oxml._core"
include = [{ path = "schema/xsd/SOURCES.md", format = ["sdist", "wheel"] }]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "schema/xsd/SOURCES.md" }]

[tool.fastship]
branch = "main"

[tool.pytest.ini_options]
testpaths = ["tests"]
