name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      LIBXML2_STATIC: '1'
      PKG_CONFIG_PATH: /tmp/oxml-libxml2/install/lib/pkgconfig
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
      - uses: PyO3/maturin-action@v1
        with:
          args: --profile dist --out dist -i python3.10 -i python3.11 -i python3.12 -i python3.13
          manylinux: auto
          docker-options: -e LIBXML2_STATIC=1 -e PKG_CONFIG_PATH=/tmp/oxml-libxml2/install/lib/pkgconfig
          before-script: |
            if [ "$(uname)" = Linux ]; then yum install -y clang; fi
            bash scripts/build_libxml2.sh /tmp/oxml-libxml2
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  test-wheels:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.os }}
          path: dist
      - run: 'pip install --no-index --find-links dist --only-binary=:all: --no-deps oxml'
      - run: pip install pytest oxml
      - run: pytest -q

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
